name: Deploy Static Website to AWS S3 & CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install AWS CLI
        run: |
          sudo apt update
          sudo apt install unzip python3-pip -y
          pip3 install awscli

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS Credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set default.region $AWS_REGION

      - name: Package Lambda Code
        run: |
          zip -j terraform/function.zip lambda/handleContactForm.py
          zip -j terraform/visitor.zip lambda/logVisitorData.py

      - name: Terraform Init & Apply
        working-directory: terraform
        run: |
          terraform init
          terraform apply -auto-approve -var-file="terraform.tfvars"

      - name: Get API Gateway URLs from Terraform
        working-directory: terraform
        run: |
          echo "VISITOR_API_URL=$(terraform output -raw visitor_api_url)" >> $GITHUB_ENV
          echo "CONTACT_API_URL=$(terraform output -raw contact_form_api_url)" >> $GITHUB_ENV

      - name: Replace API URLs in JS
        run: |
          sed -i "s|__VISITOR_API_URL__|$VISITOR_API_URL|g" frontend/script.js
          sed -i "s|__CONTACT_API_URL__|$CONTACT_API_URL|g" frontend/script.js


      - name: Upload Frontend Files to S3
        run: |
          aws s3 sync frontend/ s3://chaitalidaware.me --delete

      - name: Invalidate CloudFront Cache
        run: |
          CLOUDFRONT_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='portfolio'].Id" --output text)
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*"

      
