name: Deploy AWS Portfolio Infra

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.9.0
  PROJECT: portfolio
  BUCKET_NAME: your-portfolio-bucket-name

jobs:
  terraform:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    # ✅ Set working directory where your Terraform code is
    defaults:
      run:
        working-directory: ./terraform  # Change this if your TF files are in a different folder

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="project=${{ env.PROJECT }}" \
            -var="bucket_name=${{ env.BUCKET_NAME }}" \
            -var="alarm_email=${{ secrets.ALARM_EMAIL }}"

      - name: Get API URLs
        id: apis
        run: |
          CONTACT_URL=$(terraform output -raw contact_api_url)
          VISITOR_URL=$(terraform output -raw visitor_api_url)
          CF_ID=$(terraform output -raw cloudfront_distribution_id)
          echo "contact_url=$CONTACT_URL" >> $GITHUB_OUTPUT
          echo "visitor_url=$VISITOR_URL" >> $GITHUB_OUTPUT
          echo "cf_id=$CF_ID" >> $GITHUB_OUTPUT

  update-frontend:
    name: Update Frontend & Upload to S3
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Change frontend folder if needed
      - name: Replace API placeholders
        run: |
          sed -i "s|__CONTACT_API_URL__|${{ needs.terraform.outputs.contact_url }}|g" frontend/js/main.js
          sed -i "s|__VISITOR_API_URL__|${{ needs.terraform.outputs.visitor_url }}|g" frontend/js/main.js

      - name: Upload to S3
        run: |
          aws s3 sync ./frontend s3://${{ env.BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ needs.terraform.outputs.cf_id }} --paths "/*"
