name: Deploy AWS Portfolio Infra

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.9.0

jobs:
  terraform:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform  # Change this if your Terraform files are in root

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var-file="terraform.tfvars"

      - name: Get Outputs
        id: outputs
        run: |
          CONTACT_URL=$(terraform output -raw contact_api_url)
          VISITOR_URL=$(terraform output -raw visitor_api_url)
          CF_ID=$(terraform output -raw cloudfront_distribution_id)
          BUCKET_NAME=$(terraform output -raw bucket_name)
          echo "contact_url=$CONTACT_URL" >> $GITHUB_OUTPUT
          echo "visitor_url=$VISITOR_URL" >> $GITHUB_OUTPUT
          echo "cf_id=$CF_ID" >> $GITHUB_OUTPUT
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT

    outputs:
      contact_url: ${{ steps.outputs.outputs.contact_url }}
      visitor_url: ${{ steps.outputs.outputs.visitor_url }}
      cf_id: ${{ steps.outputs.outputs.cf_id }}
      bucket_name: ${{ steps.outputs.outputs.bucket_name }}

  update-frontend:
    name: Update Frontend & Upload to S3
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Replace API placeholders in script.js
        run: |
          if [ -f frontend/script.js ]; then
            sed -i "s|__CONTACT_API_URL__|${{ needs.terraform.outputs.contact_url }}|g" frontend/script.js
            sed -i "s|__VISITOR_API_URL__|${{ needs.terraform.outputs.visitor_url }}|g" frontend/script.js
          else
            echo "frontend/script.js not found. Skipping replacement."
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync ./frontend s3://${{ needs.terraform.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform.outputs.cf_id }} \
            --paths "/*"
